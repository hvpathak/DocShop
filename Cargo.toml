[workspace]
resolver = "3"
members = ["crates/core", "crates/rich", "crates/layout", "apps/harshpad", "apps/harshpad-cli"]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/hvpathak/DocShop"

[workspace.dependencies]
harshpad-core = { path = "crates/core" }
harshpad-rich = { path = "crates/rich" }
harshpad-layout = { path = "crates/layout" }
# The Writer is WordCraft (MIT OR Apache-2.0), from the harshpad branch of our fork (WordCraft plus
# HarshPad's embedding options), pinned; `get their update` merges upstream there and bumps this rev.
wordcraft-engine = { git = "https://github.com/hvpathak/wordcraft", rev = "1eafe01774ac3eb41e947ffbfd3c34e3ef3e9df0" }
wordcraft-ui-egui = { git = "https://github.com/hvpathak/wordcraft", rev = "1eafe01774ac3eb41e947ffbfd3c34e3ef3e9df0" }
wordcraft-proof = { git = "https://github.com/hvpathak/wordcraft", rev = "1eafe01774ac3eb41e947ffbfd3c34e3ef3e9df0" }
wordcraft-fonts = { git = "https://github.com/hvpathak/wordcraft", rev = "1eafe01774ac3eb41e947ffbfd3c34e3ef3e9df0" }
# PDF Studio is PdfCraft (MIT OR Apache-2.0), from the harshpad branch of our fork, pinned the same way.
pdfcraft-ui-egui = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }
pdfcraft-engine = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

# Never crash: these are allowed in tests only (see clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"

# Disk is tight on this machine: skip debug info in dev builds (roughly halves target/).
[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# WordCraft's PDF writer needs its patched krilla (same pin as WordCraft's own workspace).
[patch.crates-io]
krilla = { git = "https://github.com/hvpathak/craft-libs", rev = "17744430be327d0257496a6a31c8d38fe20a6756" }
# PdfCraft's vendored, patched PDF renderer, parser and windowing (as its own workspace applies them).
hayro-interpret = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }
hayro = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }
hayro-syntax = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }
hayro-jbig2 = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }
hayro-cmap = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }
hayro-postscript = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }
lopdf = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }
winit = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }
egui-wgpu = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }
vello_common = { git = "https://github.com/hvpathak/pdfcraft", rev = "010f86c5f05fcb24b950b7b49ff6b2cb952b19ab" }

[workspace]
resolver = "3"
members = ["crates/core", "crates/rich", "crates/layout", "apps/harshpad", "apps/harshpad-cli"]

[workspace.package]
version = "0.8.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/hvpathak/DocShop"

[workspace.dependencies]
harshpad-core = { path = "crates/core" }
harshpad-rich = { path = "crates/rich" }
harshpad-layout = { path = "crates/layout" }
# The Writer is WordCraft (MIT OR Apache-2.0), from the harshpad branch of our fork (WordCraft plus
# HarshPad's embedding options), pinned; `get their update` merges upstream there and bumps this rev.
wordcraft-engine = { git = "https://github.com/hvpathak/wordcraft", rev = "202d23ae1688d83167f8468ab37f0d7b3a8febb0" }
wordcraft-ui-egui = { git = "https://github.com/hvpathak/wordcraft", rev = "202d23ae1688d83167f8468ab37f0d7b3a8febb0" }
# Proofing is the shared library's craft-proof now (it was a WordCraft crate); the old name stays so
# the code's wordcraft_proof:: paths are unchanged.
wordcraft-proof = { package = "craft-proof", git = "https://github.com/hvpathak/craft-libs", rev = "01315d9c92b5b0e69082d35ca56099461a1efd45", version = "=0.1.0" }
wordcraft-fonts = { git = "https://github.com/hvpathak/wordcraft", rev = "202d23ae1688d83167f8468ab37f0d7b3a8febb0" }
# PDF Studio is PdfCraft (MIT OR Apache-2.0), from the harshpad branch of our fork, pinned the same way.
pdfcraft-ui-egui = { git = "https://github.com/hvpathak/pdfcraft", rev = "b8faaa80d13a8caa0a094260d92a1e79ed10da42" }
pdfcraft-engine = { git = "https://github.com/hvpathak/pdfcraft", rev = "b8faaa80d13a8caa0a094260d92a1e79ed10da42" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "glow", "accesskit", "wayland", "x11", "links"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

# Never crash: these are allowed in tests only (see clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"

# Disk is tight on this machine: skip debug info in dev builds (roughly halves target/).
[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# WordCraft's PDF writer needs its patched krilla (same pin as WordCraft's own workspace).
[patch.crates-io]
krilla = { git = "https://github.com/hvpathak/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
# PdfCraft's vendored, patched PDF renderer and parser (as its own workspace applies them).
hayro-interpret = { git = "https://github.com/hvpathak/pdfcraft", rev = "b8faaa80d13a8caa0a094260d92a1e79ed10da42" }
hayro = { git = "https://github.com/hvpathak/pdfcraft", rev = "b8faaa80d13a8caa0a094260d92a1e79ed10da42" }
hayro-syntax = { git = "https://github.com/hvpathak/pdfcraft", rev = "b8faaa80d13a8caa0a094260d92a1e79ed10da42" }
hayro-jbig2 = { git = "https://github.com/hvpathak/pdfcraft", rev = "b8faaa80d13a8caa0a094260d92a1e79ed10da42" }
hayro-cmap = { git = "https://github.com/hvpathak/pdfcraft", rev = "b8faaa80d13a8caa0a094260d92a1e79ed10da42" }
hayro-postscript = { git = "https://github.com/hvpathak/pdfcraft", rev = "b8faaa80d13a8caa0a094260d92a1e79ed10da42" }
lopdf = { git = "https://github.com/hvpathak/pdfcraft", rev = "b8faaa80d13a8caa0a094260d92a1e79ed10da42" }
vello_common = { git = "https://github.com/hvpathak/pdfcraft", rev = "b8faaa80d13a8caa0a094260d92a1e79ed10da42" }
vello_cpu = { git = "https://github.com/hvpathak/pdfcraft", rev = "b8faaa80d13a8caa0a094260d92a1e79ed10da42" }
# The UI toolkit and window library builds the editors need (international text input, right-to-left),
# from our own forks.
ecolor = { git = "https://github.com/hvpathak/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/hvpathak/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/hvpathak/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/hvpathak/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/hvpathak/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/hvpathak/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/hvpathak/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/hvpathak/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/hvpathak/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/hvpathak/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/hvpathak/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

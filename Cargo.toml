[workspace]
resolver = "3"
members = ["crates/core", "crates/rich", "crates/layout", "apps/harshpad", "apps/harshpad-cli"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hvpathak/HarshPad"

[workspace.dependencies]
harshpad-core = { path = "crates/core" }
harshpad-rich = { path = "crates/rich" }
harshpad-layout = { path = "crates/layout" }
# The Writer is WordCraft (MIT OR Apache-2.0), pinned; `get their update` bumps this rev.
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "117aea31a8e61bd3e306e9210800cdc42897e3c1" }
wordcraft-ui-egui = { git = "https://github.com/storytold/wordcraft", rev = "117aea31a8e61bd3e306e9210800cdc42897e3c1" }
wordcraft-proof = { git = "https://github.com/storytold/wordcraft", rev = "117aea31a8e61bd3e306e9210800cdc42897e3c1" }
wordcraft-fonts = { git = "https://github.com/storytold/wordcraft", rev = "117aea31a8e61bd3e306e9210800cdc42897e3c1" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

# Never crash: these are allowed in tests only (see clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"

# Disk is tight on this machine: skip debug info in dev builds (roughly halves target/).
[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# WordCraft's PDF writer needs its patched krilla (same pin as WordCraft's own workspace).
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }

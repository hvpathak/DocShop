[package]
name = "harshpad"
description = "HarshPad: plain text and rich documents in one fast app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
harshpad-core.workspace = true
harshpad-layout = { workspace = true }
harshpad-rich.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe.workspace = true
rfd.workspace = true
arboard = { version = "3.6", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
